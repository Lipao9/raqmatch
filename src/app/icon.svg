<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- RaqMatch favicon: the mark reversed out of a solid citron tile rather
       than drawn as a bare glyph, so it holds contrast against both light and
       dark browser chrome. The tile stays on the house palette year-round —
       a favicon that follows the seasonal slam themes would read as a
       different site in the tab strip.

       Geometry matches src/components/BrandLogo.tsx and must be updated with it.
       The mark rides in a nested <svg> with its own viewBox instead of a
       transform chain — the nested element's own fitting maths places it, so
       there is no hand-computed scale factor here to drift out of sync.

       Fill is #796900, the sRGB value of `--primary` in globals.css; the mark
       is #F8F7F4, the sRGB of `--background`. A favicon cannot read CSS
       variables, so the literals have to be kept honest by hand. -->
  <rect width="40" height="40" rx="9" fill="#796900"/>
  <svg x="10.15" y="7" width="19.7" height="26" viewBox="247 180 532 701" fill="#F8F7F4">
