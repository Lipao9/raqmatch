# Weekly Mercado Livre refresh: prices, availability and unstrung weights.
#
# Weekly rather than monthly because `freshPriceBRL` hides any price older than
# seven days. On a monthly cadence the site would show a price for one week in
# four and fall back to the US reference for the other three — the schedule has
# to match the freshness rule, or the rule silently wins.
#
# Cheap enough to justify: this is the official API, no browser, ~7 minutes.
name: Refresh Mercado Livre offers

on:
  schedule:
    # 09:00 UTC Monday — 06:00 in São Paulo, so a bad price is caught during the
    # working day rather than sitting live over a weekend.
    - cron: "0 9 * * 1"
  workflow_dispatch:

# A refresh must never race another one: both write data/offers.json, and the
# loser would open a PR from a tree the winner has already moved past.
concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 bundles npm 10, but the lock file in this repo is written by
      # npm 11, and the two disagree about optional peer dependencies: npm 11
      # leaves `@swc/core`'s optional peer on `@swc/helpers >=0.5.17` unsatisfied
      # where npm 10 insists on a nested copy, then refuses the lock for not
      # containing it. The lock is fine — `npm ci` passes on Linux under npm 11.
      # Pinning here rather than regenerating the lock under npm 10, because the
      # lock is rewritten by whoever runs `npm install` locally, and that is
      # npm 11.
      - run: npm i -g npm@11

      - run: npm ci

      - name: Match offers
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: npm run offers -- --write

      - name: Check data integrity
        run: npm run data:check

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/open-data-pr.sh offers
